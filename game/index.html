<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find the Five — a spot the difference game</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main id="app">
  <header>
    <h1>Find the Five</h1>
    <p id="status">Click a difference in the right picture.</p>
    <p id="counter">Remaining: 5</p>
  </header>
  <div id="panels">
    <canvas id="left" width="480" height="360"></canvas>
    <canvas id="right" width="480" height="360"></canvas>
  </div>
  <p id="hintline"><button id="hint">Hint (3)</button> <button id="new">New scene</button></p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
